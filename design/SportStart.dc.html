<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Nunito:wght@600;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Nunito', 'Trebuchet MS', sans-serif; }
    a { color: #0b0b0d; } a:hover { color: #333; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 18px 22px; background: #ffd60a; color: #0b0b0d; display: flex; flex-direction: column; gap: 14px;">
  <div style="font-family: 'Archivo Black', Impact, sans-serif; font-size: 34px; line-height: 1; letter-spacing: -1px;">DIVE<br>APP</div>

  <!-- 시작: 검정 큰 블록 -->
  <div style="display: flex; flex-direction: column; justify-content: center; gap: 6px; height: 130px; padding: 0 22px; border-radius: 26px; background: #0b0b0d; color: #ffd60a;">
    <div style="font-family: 'Archivo Black', Impact, sans-serif; font-size: 28px;">START DIVE</div>
    <div style="font-size: 14px; font-weight: 800; color: #ffffff; opacity: 0.85;">Wide · 16:9 · FHD · UW mid</div>
  </div>

  <!-- 최근 기록 -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-radius: 20px; background: #ffffff;">
    <div style="display: flex; flex-direction: column; gap: 1px;">
      <div style="font-size: 12px; font-weight: 800; opacity: 0.55;">LAST DIVE</div>
      <div style="font-size: 18px; font-weight: 800;">Hallim-eup</div>
    </div>
    <div style="font-family: 'Archivo Black', Impact, sans-serif; font-size: 22px;">46<span style="font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800;"> MIN</span></div>
  </div>

  <!-- 설정: 알약 그룹 -->
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-radius: 22px; background: #ffffff;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 12px; font-weight: 800; opacity: 0.55;">ASPECT</div>
      <div style="display: flex; gap: 6px;">
        <div style="flex-grow: 1; padding: 9px; text-align: center; border-radius: 12px; background: #0b0b0d; color: #ffd60a; font-size: 14px; font-weight: 800;">16:9</div>
        <div style="flex-grow: 1; padding: 9px; text-align: center; border-radius: 12px; background: #f1f1f1; font-size: 14px; font-weight: 800;">16:10</div>
        <div style="flex-grow: 1; padding: 9px; text-align: center; border-radius: 12px; background: #f1f1f1; font-size: 14px; font-weight: 800;">4:3</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 12px; font-weight: 800; opacity: 0.55;">VIDEO</div>
      <div style="display: flex; gap: 6px;">
        <div style="flex-grow: 1; padding: 9px; text-align: center; border-radius: 12px; background: #0b0b0d; color: #ffd60a; font-size: 14px; font-weight: 800;">FHD</div>
        <div style="flex-grow: 1; padding: 9px; text-align: center; border-radius: 12px; background: #f1f1f1; font-size: 14px; font-weight: 800;">4K</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 12px; font-weight: 800; opacity: 0.55;">UNDERWATER</div>
      <div style="display: flex; gap: 6px;">
        <div style="flex-grow: 1; padding: 9px; text-align: center; border-radius: 12px; background: #f1f1f1; font-size: 14px; font-weight: 800;">Weak</div>
        <div style="flex-grow: 1; padding: 9px; text-align: center; border-radius: 12px; background: #ff7a00; color: #0b0b0d; font-size: 14px; font-weight: 800;">Mid</div>
        <div style="flex-grow: 1; padding: 9px; text-align: center; border-radius: 12px; background: #f1f1f1; font-size: 14px; font-weight: 800;">Strong</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 12px; font-weight: 800; opacity: 0.55;">AUTO SLEEP</div>
      <div style="display: flex; gap: 6px;">
        <div style="flex-grow: 1; padding: 9px; text-align: center; border-radius: 12px; background: #f1f1f1; font-size: 14px; font-weight: 800;">1 min</div>
        <div style="flex-grow: 1; padding: 9px; text-align: center; border-radius: 12px; background: #0b0b0d; color: #ffd60a; font-size: 14px; font-weight: 800;">2 min</div>
        <div style="flex-grow: 1; padding: 9px; text-align: center; border-radius: 12px; background: #f1f1f1; font-size: 14px; font-weight: 800;">Off</div>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; padding-top: 10px; border-top: 2px solid #f1f1f1; font-size: 14px; font-weight: 800;"><div>Orientation</div><div style="opacity: 0.6;">Auto ›</div></div>
    <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 800;"><div>Language</div><div style="opacity: 0.6;">한국어 ›</div></div>
  </div>

  <div style="margin-top: auto; display: flex; justify-content: center; padding: 14px; border-radius: 18px; border: 3px solid #0b0b0d; font-size: 15px; font-weight: 800;">DIVE LOGS</div>
</div>
</x-dc>
</body>
</html>
