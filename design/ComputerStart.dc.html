<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Rajdhani', 'Arial Narrow', sans-serif; }
    a { color: #4fe3ff; } a:hover { color: #9df0ff; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 24px; background: #05080c; color: #e8f6fa; display: flex; flex-direction: column; gap: 18px;">
  <div style="display: flex; justify-content: space-between; align-items: baseline;">
    <div style="font-family: 'Chakra Petch', monospace; font-size: 26px; font-weight: 700; letter-spacing: 2px;">DIVEAPP</div>
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 2px; color: #4a6a75;">S23 FE</div>
  </div>

  <!-- 큰 시작 버튼 -->
  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 120px; border: 2px solid #4fe3ff; background: rgba(79,227,255,0.08);">
    <div style="font-family: 'Chakra Petch', monospace; font-size: 26px; font-weight: 700; letter-spacing: 3px; color: #4fe3ff;">START DIVE</div>
    <div style="font-size: 13px; font-weight: 600; letter-spacing: 2px; color: #8fd3e0;">GPS READY · WIDE · 16:9 · UW MID</div>
  </div>

  <!-- 최근 기록 한 줄 -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-left: 3px solid #4fe3ff; background: #0b1218;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 2px; color: #8fd3e0;">LAST DIVE · 09-07</div>
      <div style="font-size: 18px; font-weight: 600;">Hallim-eup</div>
    </div>
    <div style="font-family: 'Chakra Petch', monospace; font-size: 22px; font-weight: 700;">46<span style="font-size: 13px; color: #8fd3e0;"> MIN</span></div>
  </div>

  <!-- 설정: 세그먼트 -->
  <div style="display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 3px; color: #8fd3e0;">ASPECT</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0px; border: 1px solid #3b5560;">
        <div style="padding: 10px; text-align: center; font-size: 15px; font-weight: 600; background: #4fe3ff; color: #05080c;">16:9</div>
        <div style="padding: 10px; text-align: center; font-size: 15px; font-weight: 600; border-left: 1px solid #3b5560;">16:10</div>
        <div style="padding: 10px; text-align: center; font-size: 15px; font-weight: 600; border-left: 1px solid #3b5560;">4:3</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 3px; color: #8fd3e0;">VIDEO</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0px; border: 1px solid #3b5560;">
        <div style="padding: 10px; text-align: center; font-size: 15px; font-weight: 600; background: #4fe3ff; color: #05080c;">FHD</div>
        <div style="padding: 10px; text-align: center; font-size: 15px; font-weight: 600; border-left: 1px solid #3b5560;">4K</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 3px; color: #8fd3e0;">UNDERWATER STRENGTH</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0px; border: 1px solid #3b5560;">
        <div style="padding: 10px; text-align: center; font-size: 15px; font-weight: 600;">WEAK</div>
        <div style="padding: 10px; text-align: center; font-size: 15px; font-weight: 600; background: #4fe3ff; color: #05080c; border-left: 1px solid #3b5560;">MID</div>
        <div style="padding: 10px; text-align: center; font-size: 15px; font-weight: 600; border-left: 1px solid #3b5560;">STRONG</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 3px; color: #8fd3e0;">AUTO SLEEP</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0px; border: 1px solid #3b5560;">
        <div style="padding: 10px; text-align: center; font-size: 15px; font-weight: 600;">1 MIN</div>
        <div style="padding: 10px; text-align: center; font-size: 15px; font-weight: 600; background: #4fe3ff; color: #05080c; border-left: 1px solid #3b5560;">2 MIN</div>
        <div style="padding: 10px; text-align: center; font-size: 15px; font-weight: 600; border-left: 1px solid #3b5560;">OFF</div>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #1c2a32;">
      <div style="font-size: 15px; font-weight: 600;">ORIENTATION</div>
      <div style="font-size: 15px; font-weight: 600; color: #4fe3ff;">AUTO ›</div>
    </div>
    <div style="display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #1c2a32; border-bottom: 1px solid #1c2a32;">
      <div style="font-size: 15px; font-weight: 600;">LANGUAGE</div>
      <div style="font-size: 15px; font-weight: 600; color: #4fe3ff;">한국어 ›</div>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; justify-content: center; padding: 12px; border: 1px solid #3b5560; font-size: 14px; font-weight: 600; letter-spacing: 3px; color: #8fd3e0;">DIVE LOGS</div>
</div>
</x-dc>
</body>
</html>
