<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', 'Helvetica Neue', sans-serif; }
    a { color: #0a3a4a; } a:hover { color: #0e5a70; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: linear-gradient(180deg, #0b3d55 0%, #0e6b80 45%, #0a4a58 100%); color: #ffffff;">
  <div style="position: absolute; left: -60px; top: 120px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(180,240,255,0.35), transparent 70%);"></div>

  <div style="position: relative; box-sizing: border-box; padding: 60px 22px 24px; height: 100%; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 13px; font-weight: 500; opacity: 0.75;">Sunday, Sep 7</div>
      <div style="font-size: 32px; font-weight: 800; letter-spacing: -0.5px;">Ready to dive</div>
    </div>

    <!-- 시작 카드 -->
    <div style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 24px; background: rgba(255,255,255,0.14); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.25);">
      <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; opacity: 0.85;">
        <div>Wide · 16:9 · FHD</div>
        <div>UW medium</div>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 16px; background: #ffffff; color: #0a3a4a; font-size: 18px; font-weight: 800;">Start dive</div>
    </div>

    <!-- 최근 기록 카드 -->
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-radius: 20px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.18);">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 12px; font-weight: 500; opacity: 0.7;">Last dive</div>
        <div style="font-size: 17px; font-weight: 700;">Hallim-eup</div>
      </div>
      <div style="font-size: 17px; font-weight: 700;">46 min</div>
    </div>

    <!-- 설정 리스트 -->
    <div style="display: flex; flex-direction: column; border-radius: 20px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.18); overflow: hidden;">
      <div style="display: flex; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.12);"><div style="font-size: 15px; font-weight: 600;">Aspect ratio</div><div style="font-size: 15px; font-weight: 500; opacity: 0.8;">16:9</div></div>
      <div style="display: flex; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.12);"><div style="font-size: 15px; font-weight: 600;">Video</div><div style="font-size: 15px; font-weight: 500; opacity: 0.8;">FHD</div></div>
      <div style="display: flex; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.12);"><div style="font-size: 15px; font-weight: 600;">Underwater strength</div><div style="font-size: 15px; font-weight: 500; opacity: 0.8;">Medium</div></div>
      <div style="display: flex; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.12);"><div style="font-size: 15px; font-weight: 600;">Auto power save</div><div style="font-size: 15px; font-weight: 500; opacity: 0.8;">2 min</div></div>
      <div style="display: flex; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.12);"><div style="font-size: 15px; font-weight: 600;">Orientation</div><div style="font-size: 15px; font-weight: 500; opacity: 0.8;">Auto</div></div>
      <div style="display: flex; justify-content: space-between; padding: 16px 20px;"><div style="font-size: 15px; font-weight: 600;">Language</div><div style="font-size: 15px; font-weight: 500; opacity: 0.8;">한국어</div></div>
    </div>

    <div style="margin-top: auto; display: flex; justify-content: center; padding: 14px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.35); font-size: 15px; font-weight: 700;">Dive logs</div>
  </div>
</div>
</x-dc>
</body>
</html>
